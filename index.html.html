  {id:'D',name:'憂鬱',col:1,cssVar:'--c-d',shape:'circle',cuts:[10,14,21,28]},

];

/* ---------- 統計 ---------- */
function tCrit(df){ // 雙尾 95% t 臨界值（Cornish-Fisher 近似）
  const z=1.959964;
  return z+(z**3+z)/(4*df)+(5*z**5+16*z**3+3*z)/(96*df*df);
}
function levelOf(score,cuts){let l=0;for(const c of cuts){if(score>=c)l++}return l}
function analyse(sampleKey){
  const rows=DATA.samples[sampleKey].rows;
  const maxAge=Math.max(...rows.map(r=>r[0]));
  const groups=BREAKS.map(([lo,hi],i)=>{
    const sub=rows.filter(r=>r[0]>=lo&&r[0]<=hi);
    const top=i===BREAKS.length-1;
    return {label:`${lo}–${top?maxAge:hi}`,rows:sub};
  });
  groups.push({label:'全體',rows,total:true});
  groups.forEach(g=>{
    g.n=g.rows.length;
    g.stat={};
    SCALES.forEach(sc=>{
      const v=g.rows.map(r=>r[sc.col]);
      const n=v.length;
      const mean=v.reduce((a,b)=>a+b,0)/n;
      const sd=Math.sqrt(v.reduce((a,b)=>a+(b-mean)**2,0)/(n-1));
      const half=tCrit(n-1)*sd/Math.sqrt(n);
      const cnt=[0,0,0,0,0];
      v.forEach(x=>cnt[levelOf(x,sc.cuts)]++);
      g.stat[sc.id]={mean,sd,lo:mean-half,hi:mean+half,cnt,pct:cnt.map(c=>c/n*100)};
    });
  });
  return groups;
}
const CACHE={};
const getG=k=>CACHE[k]||(CACHE[k]=analyse(k));

/* ---------- 控制項 ---------- */
function radioChip(name,value,label,checked,extra=''){
  return `<label class="opt"><input type="radio" name="${name}" value="${value}" ${checked?'checked':''}><span>${extra}${label}</span></label>`;
}
function buildControls(){
  $('#ctlView').innerHTML=
    radioChip('view','mean','年齡對各分量的平均數',state.view==='mean')+
    radioChip('view','sev','各年齡層嚴重度分布',state.view==='sev');
  $('#ctlSample').innerHTML=Object.entries(DATA.samples).map(([k,s])=>
    radioChip('sample',k,`${s.name}（N=${s.rows.length}）`,state.sample===k)).join('');
  buildScaleCtl();
}
function buildScaleCtl(){
  const box=$('#ctlScale');
  if(state.view==='mean'){
    $('#scaleLegend').textContent='分量表（可複選，至少一個）';
    box.innerHTML=SCALES.map(sc=>`<label class="opt"><input type="checkbox" name="scaleM" value="${sc.id}" ${state.meanSel.has(sc.id)?'checked':''}><span style="${''}"><i class="sw" style="color:${cssv(sc.cssVar)};background:${cssv(sc.cssVar)}"></i>${sc.name}</span></label>`).join('');
  }else{
    $('#scaleLegend').textContent='分量表（單選）';
    box.innerHTML=SCALES.map(sc=>radioChip('scaleS',sc.id,sc.name,state.sevSel===sc.id)).join('');
  }
}
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.name==='view'){state.view=t.value;buildScaleCtl();render();}
  else if(t.name==='sample'){state.sample=t.value;render();}
  else if(t.name==='scaleS'){state.sevSel=t.value;render();}
  else if(t.name==='scaleM'){
    if(t.checked)state.meanSel.add(t.value);
    else{
      if(state.meanSel.size===1){t.checked=true;return;} // 至少保留一個
      state.meanSel.delete(t.value);
    }
    render();
  }
});

/* ---------- 圖表一：折線圖 ---------- */
function marker(shape,x,y,r,color,extra=''){
  const st=`fill:${color};stroke:var(--panel);stroke-width:1.5`;
  if(shape==='circle')return `<circle cx="${x}" cy="${y}" r="${r}" style="${st}" ${extra}/>`;
  if(shape==='square')return `<rect x="${x-r}" y="${y-r}" width="${2*r}" height="${2*r}" rx="1.5" style="${st}" ${extra}/>`;
  const h=r*1.25;
  return `<polygon points="${x},${y-h} ${x+h},${y+h*0.8} ${x-h},${y+h*0.8}" style="${st}" ${extra}/>`;
}
function drawMean(){
  const G=getG(state.sample).filter(g=>!g.total);
  const W=760,H=430,m={l:58,r:18,t:20,b:76};
  const pw=W-m.l-m.r,ph=H-m.t-m.b;
  const X=i=>m.l+pw/G.length*(i+.5);
  const Y=v=>m.t+ph*(1-v/42);
  const sel=SCALES.filter(s=>state.meanSel.has(s.id));
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="各年齡組憂鬱、焦慮、壓力分量表平均數折線圖，含 95% 信賴區間">`;
  for(let v=0;v<=42;v+=6){
    s+=`<line x1="${m.l}" x2="${W-m.r}" y1="${Y(v)}" y2="${Y(v)}" style="stroke:var(--grid)"/>`;
    s+=`<text x="${m.l-10}" y="${Y(v)+4}" text-anchor="end" font-size="12" class="t-muted">${v}</text>`;
  }
  s+=`<line x1="${m.l}" x2="${m.l}" y1="${m.t}" y2="${m.t+ph}" style="stroke:var(--line)"/>`;
  s+=`<text transform="translate(16 ${m.t+ph/2}) rotate(-90)" text-anchor="middle" font-size="13" class="t-muted">分量表總分（0–42）</text>`;
  G.forEach((g,i)=>{
    s+=`<text x="${X(i)}" y="${m.t+ph+24}" text-anchor="middle" font-size="13.5">${g.label}</text>`;
    s+=`<text x="${X(i)}" y="${m.t+ph+43}" text-anchor="middle" font-size="12.5" class="t-muted">（n=${g.n}）</text>`;
  });
  const step=sel.length>1?16:0;
  sel.forEach((sc,j)=>{
    const dx=(j-(sel.length-1)/2)*step;
    const col=cssv(sc.cssVar);
    const pts=G.map((g,i)=>[X(i)+dx,Y(g.stat[sc.id].mean)]);
    s+=`<polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" style="stroke:${col};stroke-width:2.2;stroke-linejoin:round"/>`;
    G.forEach((g,i)=>{
      const st=g.stat[sc.id],x=X(i)+dx;
      const y1=Y(Math.min(42,st.hi)),y2=Y(Math.max(0,st.lo));
      s+=`<g style="stroke:${col};stroke-width:1.6"><line x1="${x}" x2="${x}" y1="${y1}" y2="${y2}"/><line x1="${x-4.5}" x2="${x+4.5}" y1="${y1}" y2="${y1}"/><line x1="${x-4.5}" x2="${x+4.5}" y1="${y2}" y2="${y2}"/></g>`;
    });
    G.forEach((g,i)=>{
      const st=g.stat[sc.id],x=X(i)+dx,y=Y(st.mean);
      const tip=`<b>${sc.name}　${g.label}（n=${g.n}）</b><br>平均數：${fmt(st.mean)}<br>標準差：${fmt(st.sd)}<br>95% CI：${fmt(st.lo)} – ${fmt(st.hi)}`;
      s+=marker(sc.shape,x,y,5.2,col);
      s+=`<circle cx="${x}" cy="${y}" r="13" fill="transparent" data-tip="${tip.replace(/"/g,'&quot;')}"/>`;
    });
  });
  s+='</svg>';
  $('#chart').innerHTML=`<p class="chart-title">年齡對各分量的平均數</p><p class="chart-sub">圓點為平均數，誤差線為 95% 信賴區間；滑鼠移到點上可看平均數與標準差。</p>`+s;
  $('#legend').innerHTML=sel.map(sc=>`<span><svg width="16" height="12" viewBox="0 0 16 12" style="vertical-align:-1px;margin-right:6px">${marker(sc.shape,8,6,4.2,cssv(sc.cssVar))}</svg>${sc.name}</span>`).join('');
}

/* ---------- 圖表二：橫向堆疊長條圖 ---------- */
function drawSev(){
  const G=getG(state.sample).filter(g=>!g.total);
  const sc=SCALES.find(x=>x.id===state.sevSel);
  const W=760,rowH=46,gap=14,m={l:128,r:20,t:14,b:44};
  const H=m.t+m.b+G.length*rowH+(G.length-1)*gap;
  const pw=W-m.l-m.r;
  const X=p=>m.l+pw*p/100;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="各年齡組${sc.name}嚴重度分布橫向堆疊長條圖">`;
  for(let p=0;p<=100;p+=20){
    s+=`<line x1="${X(p)}" x2="${X(p)}" y1="${m.t-4}" y2="${H-m.b+4}" style="stroke:var(--grid)"/>`;
    s+=`<text x="${X(p)}" y="${H-m.b+22}" text-anchor="middle" font-size="12" class="t-muted">${p}%</text>`;
  }
  G.forEach((g,i)=>{
    const y=m.t+i*(rowH+gap);
    s+=`<text x="${m.l-12}" y="${y+rowH/2-3}" text-anchor="end" font-size="13.5">${g.label}</text>`;
    s+=`<text x="${m.l-12}" y="${y+rowH/2+14}" text-anchor="end" font-size="12" class="t-muted">（n=${g.n}）</text>`;
    let acc=0;
    g.stat[sc.id].pct.forEach((p,k)=>{
      const x0=X(acc),w=X(acc+p)-x0;acc+=p;
      if(w<=0)return;
      const tip=`<b>${g.label}（n=${g.n}）</b><br>${sc.name}・${LEVELS[k]}：${fmt(p,1)}%<br>（${g.stat[sc.id].cnt[k]} 人）`;
      s+=`<rect x="${x0}" y="${y}" width="${w}" height="${rowH}" style="fill:${cssv(LEVEL_VARS[k])};stroke:var(--panel);stroke-width:1.5" data-tip="${tip.replace(/"/g,'&quot;')}"/>`;
      if(w>34){
        const light=k<=1||(k===2);
        s+=`<text x="${x0+w/2}" y="${y+rowH/2+4.5}" text-anchor="middle" font-size="12.5" style="fill:${light?'#1c2833':'#fff'};pointer-events:none">${Math.round(p)}%</text>`;
      }
    });
  });
  s+='</svg>';
  const rng=['0','1','2','3','4'].map((_,k)=>{
    const c=sc.cuts,lo=k===0?0:c[k-1],hi=k===4?42:c[k]-1;
    return k===4?`${lo}–42`:`${lo}–${hi}`;
  });
  $('#chart').innerHTML=`<p class="chart-title">各年齡層${sc.name}嚴重度分布</p><p class="chart-sub">每條長條合計 100%；滑鼠移到區段上可看等級與百分比。</p>`+s;
  $('#legend').innerHTML=LEVELS.map((l,k)=>`<span><i style="background:${cssv(LEVEL_VARS[k])}"></i>${l}（${rng[k]} 分）</span>`).join('');
}

  if(state.view==='mean'){

    sel.forEach(sc=>h+=`<th colspan="3" style="text-align:center;color:${cssv(sc.cssVar)}">${sc.name}</th>`);
    h+='</tr><tr class="sub">';
    sel.forEach(()=>h+='<th>平均數</th><th>標準差</th><th>95% CI</th>');
    h+='</tr></thead><tbody>';
    G.forEach(g=>{
      h+=`<tr class="${g.total?'total':''}"><td>${g.label}</td><td>${g.n}</td>`;
      sel.forEach(sc=>{const t=g.stat[sc.id];h+=`<td>${fmt(t.mean)}</td><td>${fmt(t.sd)}</td><td>${fmt(t.lo)} – ${fmt(t.hi)}</td>`});
      h+='</tr>';
    });
    h+='</tbody>';
  }else{
    const sc=SCALES.find(x=>x.id===state.sevSel);
    h+=`<caption>樣本：${sname}；${sc.name}分量表各嚴重度等級的人數（占該年齡組百分比）。</caption><thead><tr><th>年齡組</th><th>人數 n</th>${LEVELS.map(l=>`<th>${l}</th>`).join('')}</tr></thead><tbody>`;
    G.forEach(g=>{
      const t=g.stat[sc.id];
      h+=`<tr class="${g.total?'total':''}"><td>${g.label}</td><td>${g.n}</td>${t.cnt.map((c,k)=>`<td>${c}（${fmt(t.pct[k],1)}%）</td>`).join('')}</tr>`;
    });
    h+='</tbody>';
  }
  $('#tbl').innerHTML=h;
}

/* ---------- 註解 ---------- */
function drawNotes(){
  const S=DATA.samples,raw=S.raw,cl=S.clean;
  $('#notes').innerHTML=`
  <h2>註解</h2>
  <ul>
    <li><b>平均數與標準差：</b>平均數是該年齡組分量表總分的平均；標準差（SD）描述組內個別分數的分散程度，SD 大代表同一年齡組內差異很大。</li>
    <li><b>95% 信賴區間（CI）：</b>以 t 分布計算（平均數 ± t × SD/√n），反映「平均數估計得準不準」，不是個人分數的範圍。人數越少，區間越寬；兩組的區間若明顯不重疊，才比較能說平均數有差異，但仍需正式檢定。</li>
    <li><b>嚴重度分級：</b>依 DASS-42 常用切點，憂鬱 0–9／10–13／14–20／21–27／28 以上、焦慮 0–7／8–9／10–14／15–19／20 以上、壓力 0–14／15–18／19–25／26–33／34 以上，依序對應正常、輕度、中度、重度、極重度。分級是篩檢用的參考，不等於臨床診斷。</li>
    <li><b>計分：</b>原始資料的選項為 1–4，計分時先減 1 換成 0–3 分再加總；分量表總分未乘以 2（乘以 2 是 DASS-21 才需要的做法）。</li>
    <li><b>樣本：</b>「原始資料」共 ${S.raw.total_in_file} 筆，其中 ${raw.excluded} 筆年齡填 1991（明顯是填成出生年）無法分組，已排除，實際使用 ${raw.rows.length} 筆；「清洗後」為你提供的清洗結果，共 ${cl.rows.length} 筆。切換樣本時，圖表與表格會同步更新。</li>
    <li><b>年齡分組：</b>資料中最小年齡為 13 歲，所以最年輕一組是 13–17。45 歲以上的人數偏少（清洗後 ${getG('clean')[4].n} 人），這一組的平均數與百分比波動較大，解讀時要保守。</li>
  </ul>
  <p class="small">注意事項：這是同一時間點的橫斷面資料，只能看出年齡與分數有關聯，不能推論「年齡增加造成分數變化」；受試者來自線上自願填答，且以年輕族群為主，結果不一定能代表一般人口。DASS 為自陳量表，容易受當下心情與填答方式影響。</p>`;
}

/* ---------- 提示框 ---------- */
const tip=$('#tip');
function showTip(e){
  const el=e.target.closest&&e.target.closest('[data-tip]');
  if(!el){tip.style.opacity=0;return;}
  tip.innerHTML=el.getAttribute('data-tip');
  tip.style.opacity=1;
  const pad=14,w=tip.offsetWidth,h=tip.offsetHeight;
  let x=e.clientX+pad,y=e.clientY+pad;
  if(x+w>innerWidth-8)x=e.clientX-w-pad;
  if(y+h>innerHeight-8)y=e.clientY-h-pad;
  tip.style.left=Math.max(8,x)+'px';tip.style.top=Math.max(8,y)+'px';
}
$('#chart').addEventListener('pointermove',showTip);
$('#chart').addEventListener('pointerdown',showTip);
$('#chart').addEventListener('pointerleave',()=>tip.style.opacity=0);
document.addEventListener('scroll',()=>tip.style.opacity=0,{passive:true});

function render(){
  tip.style.opacity=0;
  state.view==='mean'?drawMean():drawSev();
  drawTable();
  drawNotes();
}
buildControls();
render();
</script>
